---
# ---------- Packages ----------
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install security packages
  ansible.builtin.apt:
    name:
      - ufw
      - unattended-upgrades
    state: present

# ---------- Admin user ----------
- name: Create admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Add SSH public key for admin user
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ lookup('ansible.builtin.file', admin_ssh_pubkey) }}"
    state: present

- name: Allow admin user to use sudo without a password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# ---------- SSH hardening ----------
- name: Harden SSH server settings
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      # Managed by Ansible - do not edit by hand
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 3
      X11Forwarding no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

# ---------- Firewall ----------
- name: Firewall - allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Firewall - deny all other incoming traffic by default
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Firewall - allow all outgoing traffic
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Firewall - enable
  community.general.ufw:
    state: enabled

# ---------- Automatic security updates ----------
- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
